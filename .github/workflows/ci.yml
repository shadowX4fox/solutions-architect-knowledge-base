name: ci

# test on every push and pull request; the image is built for every one too, and published to
# ghcr.io/shadowx4fox/alia-mcp-server from main (edge) and from a v* tag (the version, and latest)
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/shadowx4fox/alia-mcp-server

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # every test; QdrantTest is skipped without QDRANT_TEST_HOST
      - run: ./mvnw -B -ntp verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr
          # the same on the image and, as annotations, on the multi-arch index, where GHCR reads the package's description
          labels: &oci |
            org.opencontainers.image.title=Alia — the architecture MCP server
            org.opencontainers.image.description=Your architecture, served to every developer's IDE: ask it while you work, build a component from its spec, escalate what needs an architect.
            org.opencontainers.image.documentation=https://github.com/shadowX4fox/solutions-architect-knowledge-base#readme
            org.opencontainers.image.licenses=MIT
          annotations: *oci
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # the image starts, takes a bundle and answers over MCP — before anything is published
      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: alia-mcp-server:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name alia -p 8080:8080 -e ARCHINDEX_STORE=memory -e ARCHINDEX_INGEST_TOKEN=ci \
            -e ARCHINDEX_MCP_TOKEN=ide -e OLLAMA_BASE_URL=http://localhost:1 alia-mcp-server:smoke
          for i in $(seq 1 60); do curl -fs localhost:8080/actuator/health >/dev/null && break; sleep 1; done
          tar -czf - -C src/test/resources/bundles/order-desk/1.4.0 . | curl -fsS -H "Authorization: Bearer ci" \
            -H "Content-Type: application/gzip" --data-binary @- "localhost:8080/bundles/order-desk/1.4.0?channel=released"
          echo
          curl -fsS localhost:8080/mcp -H "Authorization: Bearer ide" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_projects","arguments":{}}}' | tee answer.txt
          grep -q '\\"project\\":\\"order-desk\\"' answer.txt
      - if: failure()
        run: docker logs alia

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for amd64 and arm64${{ github.event_name != 'pull_request' && ', and publish' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
