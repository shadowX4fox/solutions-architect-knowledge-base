name = "mcp-server"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[r2_buckets]]
binding = "R2_DOCS"
bucket_name = "solution-docs"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "solution-docs-index"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "DocsAgent"

[[migrations]]
tag = "v1"
new_classes = ["DocsAgent"]

# ANTHROPIC_API_KEY is a secret — set via:
# wrangler secret put ANTHROPIC_API_KEY