# The server with its dependencies, self-hosted: no architecture text leaves the network.
#   docker compose -f deploy/compose.yaml up -d                                # Qdrant engine: server, qdrant, ollama
#   docker compose -f deploy/compose.yaml --profile file up -d server-file     # file engine: server-file, ollama — no Qdrant
#   docker compose -f deploy/compose.yaml --profile scale up -d                # plus a reader on 8081: the same bundles volume and collection
#   docker compose -f deploy/compose.yaml exec ollama ollama pull qwen3-embedding:0.6b
# Run one server or the other: both publish 8080. The file engine keeps its vectors with the bundles, in /data/index.
# For the GPU, give the ollama service the device: AMD — devices /dev/kfd and /dev/dri with image ollama/ollama:rocm; NVIDIA — gpus: all.
# Set ARCHINDEX_INGEST_TOKEN (the pipelines' SA_INDEX_TOKEN) and ARCHINDEX_MCP_TOKEN in the environment or an .env file.
# ARCHINDEX_PUBLIC_URL (https://alia-mcp.internal) gives every build pack part a download_url.
x-server: &server
  build: ..
  ports:
    - "8080:8080"
  volumes:
    - bundles:/data

x-server-env: &server-env
  OLLAMA_BASE_URL: http://ollama:11434
  ARCHINDEX_EMBEDDING_MODEL: ${ARCHINDEX_EMBEDDING_MODEL:-qwen3-embedding:0.6b}
  ARCHINDEX_INGEST_TOKEN: ${ARCHINDEX_INGEST_TOKEN:?set ARCHINDEX_INGEST_TOKEN}
  ARCHINDEX_MCP_TOKEN: ${ARCHINDEX_MCP_TOKEN:-}
  ARCHINDEX_PUBLIC_URL: ${ARCHINDEX_PUBLIC_URL:-}

services:
  server:
    <<: *server
    environment:
      <<: *server-env
      ARCHINDEX_STORE: qdrant
      QDRANT_HOST: qdrant
    depends_on:
      - qdrant
      - ollama

  # several instances: "server" is the one writer (role all); readers answer, refuse a publish and follow the writer.
  # Put a load balancer in front for /mcp and /packs, and send /bundles to the writer.
  reader:
    <<: *server
    profiles: [scale]
    ports:
      - "8081:8080"
    environment:
      <<: *server-env
      ARCHINDEX_ROLE: reader
      ARCHINDEX_STORE: qdrant
      QDRANT_HOST: qdrant
    depends_on:
      - server

  server-file:
    <<: *server
    profiles: [file]
    environment:
      <<: *server-env
      ARCHINDEX_STORE: file
    depends_on:
      - ollama

  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama

volumes:
  bundles:
  qdrant:
  ollama:
